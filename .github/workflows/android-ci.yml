name: Android CI
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select preinstalled JDK 17
        run: |
          test -n "$JAVA_HOME_17_X64"
          test -x "$JAVA_HOME_17_X64/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version
      - name: Locate Android SDK tools
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"; fi
          test -x "$SDKMANAGER"
          AVDMANAGER="${SDKMANAGER%/sdkmanager}/avdmanager"
          test -x "$AVDMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK platform and emulator image
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"
      - name: Scan source for common secret patterns
        run: python3 scripts/secret-scan.py
      - name: Validate Phase 4 Room v5 and encrypted dense-index migrations
        run: python3 scripts/check-phase4-schema.py
      - name: Test Gradle bootstrap executable permissions
        run: python3 scripts/test-gradle-bootstrap.py
      - name: Test AGP built-in Kotlin migration policy
        run: python3 scripts/test-built-in-kotlin.py
      - name: Verify AGP built-in Kotlin and public DSL migration
        run: python3 scripts/verify-built-in-kotlin.py
      - name: Verify static dependency versions and lock policy
        run: python3 scripts/verify-gradle-reproducibility.py
      - name: Verify Phase 4C corpus UI and encrypted embedding foundation
        run: python3 scripts/check-phase4c-foundation.py
      - name: Verify Gradle distribution
        run: ./gradlew --version
      - name: Unit tests and write dependency locks
        run: ./gradlew --no-daemon --no-configuration-cache --write-locks :app:testOfflineSideloadDebugUnitTest :core:authorization:testDebugUnitTest :core:agent-runtime:testDebugUnitTest :core:timeline-api:testDebugUnitTest :core:persistence:testDebugUnitTest :core:knowledge-api:testDebugUnitTest :core:corpus:testDebugUnitTest :core:retrieval:testDebugUnitTest :feature:timeline:testDebugUnitTest :feature:canvas:testDebugUnitTest :feature:corpus-management:testDebugUnitTest
      - name: Assemble and lint
        run: ./gradlew --no-daemon --no-configuration-cache --write-locks :app:assembleOfflineSideloadDebug :app:lintOfflineSideloadDebug :core:corpus:lint :core:retrieval:lint :feature:corpus-management:lint
      - name: Audit offline merged manifest
        run: |
          ./gradlew --no-daemon --no-configuration-cache --write-locks :app:processOfflineSideloadDebugMainManifest
          MANIFEST="$(find app/build/intermediates -type f -path '*offlineSideloadDebug*' -name AndroidManifest.xml | grep -E 'merged_manifest|merged_manifests' | head -1)"
          test -n "$MANIFEST" && test -f "$MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "Forbidden INTERNET permission found in offline manifest: $MANIFEST" >&2
            exit 1
          fi
      - name: Start API 36 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo no | "$AVDMANAGER" create avd --force --name timeline-ci-api36 --package "system-images;android-36;google_apis;x86_64" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd timeline-ci-api36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none > /tmp/timeline-emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 60); do
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOTED" = "1" ] && break
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Instrumented Android tests
        run: ./gradlew --no-daemon --no-configuration-cache --write-locks :app:connectedOfflineSideloadDebugAndroidTest :core:persistence:connectedDebugAndroidTest :core:corpus:connectedDebugAndroidTest :core:retrieval:connectedDebugAndroidTest
      - name: Dependency resolution report
        if: always()
        run: ./gradlew --no-daemon --no-configuration-cache --write-locks :app:dependencies --configuration offlineSideloadDebugRuntimeClasspath > dependency-report.txt
      - name: CycloneDX SBOM
        if: always()
        run: ./gradlew --no-daemon --no-configuration-cache --write-locks cyclonedxBom

      - name: Upload generated dependency lockfiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-dependency-lockfiles
          path: |
            **/gradle.lockfile
            **/buildscript-gradle.lockfile
          if-no-files-found: warn
          retention-days: 30
