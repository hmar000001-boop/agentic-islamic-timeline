name: Verify retail-agent comparison workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: Linux — wrapper, full reactor and reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify launcher shell syntax and offline bootstrap behavior
        run: |
          for script in ./mvnw ./scripts/test-wrapper-bootstrap.sh ./scripts/verify-reproducible-build.sh; do
            sh -n "$script"
          done
          chmod +x ./mvnw ./scripts/*.sh
          ./scripts/test-wrapper-bootstrap.sh
      - name: Verify pinned Maven distribution and Java toolchain
        run: |
          ./mvnw --version
          java -version
      - name: Run two clean full-reactor builds and compare packaged artifacts
        run: ./scripts/verify-reproducible-build.sh
      - name: Create test inventory
        if: always()
        run: python scripts/report-test-inventory.py --root . --output artifacts/test-inventory-linux.txt
      - name: Upload Linux verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retail-agent-linux-verification
          path: |
            artifacts/test-inventory-linux.txt
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 14

  verify-windows:
    name: Windows — bootstrap and full reactor
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify pinned Maven distribution and Java toolchain
        shell: pwsh
        run: |
          .\mvnw.cmd --version
          java -version
      - name: Build and test all modules with simulated providers
        shell: pwsh
        run: .\mvnw.cmd -B -ntp -Dapp.llm.provider=simulated -Dapp.llm.record=false clean verify
      - name: Create test inventory
        if: always()
        shell: pwsh
        run: python scripts/report-test-inventory.py --root . --output artifacts/test-inventory-windows.txt
      - name: Upload Windows verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retail-agent-windows-verification
          path: |
            artifacts/test-inventory-windows.txt
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 14

  verify-postgres-backends:
    name: PostgreSQL — graph checkpoint and CoALA memory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: langgraph4j
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase2-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph4j"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_GRAPH_CHECKPOINT_BACKEND: postgres
      APP_GRAPH_CHECKPOINT_HOST: localhost
      APP_GRAPH_CHECKPOINT_PORT: 5432
      APP_GRAPH_CHECKPOINT_DATABASE: langgraph4j
      APP_GRAPH_CHECKPOINT_USERNAME: postgres
      APP_GRAPH_CHECKPOINT_PASSWORD: phase2-ci-only-password
      APP_GRAPH_CHECKPOINT_CREATE_TABLES: true
      APP_MEMORY_BACKEND: postgres
      APP_MEMORY_JDBC_URL: jdbc:postgresql://localhost:5432/langgraph4j
      APP_MEMORY_JDBC_USERNAME: postgres
      APP_MEMORY_JDBC_PASSWORD: phase2-ci-only-password
      APP_MEMORY_INITIALIZE_SCHEMA: true
      APP_LLM_PROVIDER: simulated
      APP_LLM_RECORD: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify PostgreSQL-backed graph checkpoint and CoALA memory runtime
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp -pl retail-agent-langgraph4j -am test
      - name: Create test inventory
        if: always()
        run: python scripts/report-test-inventory.py --root . --output artifacts/test-inventory-postgres.txt
      - name: Upload PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retail-agent-postgres-verification
          path: |
            artifacts/test-inventory-postgres.txt
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 14
